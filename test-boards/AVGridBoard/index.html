<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>AVGrid</title>
    <link rel="stylesheet" href="./board-base.css" />
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <header class="bar">
        <div class="field">
            <label for="rows">Rows</label>
            <input id="rows" type="number" value="1000" min="0" step="1000" />
        </div>
        <button id="rebuild">Rebuild</button>
        <button id="bench" class="secondary">Benchmark 100k</button>
        <button id="minimal" class="secondary">Minimum call</button>
        <button id="tree" class="secondary" title="Task 59: a 3-level tree over a host-side engine, collapsible">Tree 10k</button>
        <button id="tree-static" class="secondary" title="Task 59: roots always open (no chevron, no slot), no gesture">Tree static</button>
        <label class="field check" title="Task 58: disableColumnReorder, flipped live">
            <input id="noreorder" type="checkbox" /> Reorder off
        </label>
        <div class="field" title="Task 60: rowHeight / headerHeight, applied live; blank header = follow rows">
            <label for="rowh">Row h</label>
            <input id="rowh" type="number" value="24" min="1" step="1" style="width:4em" />
            <label for="headerh">Header h</label>
            <input id="headerh" type="number" placeholder="rows" min="1" step="1" style="width:4em" />
        </div>
        <div class="field">
            <label for="search">Search</label>
            <input id="search" type="text" placeholder="filter rows…" />
        </div>
        <span id="status" class="status">starting…</span>
    </header>

    <section id="results" class="results" hidden></section>

    <div id="grid-host" class="grid-host"></div>

    <footer class="bar footer">
        <span id="live" class="status"></span>
    </footer>

    <script type="module" src="./app.js"></script>
</body>
</html>
