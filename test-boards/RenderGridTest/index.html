<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>RenderGrid Benchmark</title>
    <link rel="stylesheet" href="./board-base.css" />
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <header class="bar">
        <div class="field">
            <label for="rows">Rows</label>
            <input id="rows" type="number" value="100000" min="1" step="1000" />
        </div>
        <div class="field">
            <label for="cols">Columns</label>
            <input id="cols" type="number" value="20" min="1" />
        </div>
        <button id="rebuild">Rebuild</button>
        <button id="run">Run benchmark</button>
        <button id="clear" class="secondary">Clear results</button>
        <span id="status" class="status">starting…</span>
    </header>

    <section id="results" class="results" hidden></section>

    <div id="grid-host" class="grid-host"></div>

    <footer class="bar footer">
        <span id="live" class="status"></span>
    </footer>

    <script type="module" src="./app.js"></script>
    <script type="module" src="./scroll-loss.js"></script>
    <script type="module" src="./after-paint.js"></script>
    <script type="module" src="./measured.js"></script>
</body>
</html>
