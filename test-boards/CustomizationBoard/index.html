<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>AVGrid — customization</title>
    <link rel="stylesheet" href="./board-base.css" />
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <header class="bar">
        <div class="field">
            <label for="rows">Rows</label>
            <input id="rows" type="number" value="2000" min="0" step="1000" />
        </div>
        <button id="rebuild">Rebuild</button>
        <button id="hooks" class="secondary">Hooks: on</button>
        <button id="runAll" class="secondary">Run all checks</button>
        <span id="status" class="status">starting…</span>
    </header>

    <section id="results" class="results" hidden></section>

    <div id="grid-host" class="grid-host"></div>

    <footer class="bar footer">
        <span id="live" class="status"></span>
    </footer>

    <script type="module" src="./app.js"></script>
</body>
</html>
