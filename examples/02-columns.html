<!DOCTYPE html>
<!--
    av-grid — explicit columns: widths, alignment, formatting.

    Run: npm run build once, then serve this folder (npx serve .) and open the file.
-->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>av-grid — columns</title>
    <style>
        body { margin: 0; font: 14px system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 12px 16px; border-bottom: 1px solid #ddd; }
        h1 { margin: 0 0 4px; font-size: 15px; }
        p { margin: 0; color: #666; }
        #host { flex: 1 1 auto; min-height: 0; }
    </style>
</head>
<body>
    <header>
        <h1>Columns</h1>
        <p>Widths in pixels or percent, alignment, <code>dataType</code>,
        <code>displayFormat</code>, a computed column, a hidden one, and a read-only one.</p>
    </header>

    <div id="host"></div>

    <script type="module">
        import { AVGrid } from "../dist/av-grid.js";

        const rows = [
            { id: 1, first: "Ada", last: "Lovelace", team: "platform", score: 98, joined: new Date(2019, 2, 14), phone: "5551234567", secret: "x" },
            { id: 2, first: "Alan", last: "Turing", team: "research", score: 95, joined: new Date(2020, 6, 1), phone: "5559876543", secret: "y" },
            { id: 3, first: "Grace", last: "Hopper", team: "infra", score: 91, joined: new Date(2018, 10, 30), phone: "555", secret: "z" },
            { id: 4, first: "Edsger", last: "Dijkstra", team: "research", score: 88, joined: new Date(2021, 0, 8), phone: "5552223333", secret: "w" },
        ];

        const grid = AVGrid.create("#host", {
            rows,
            columns: [
                // Right-aligned by declaration. A number column aligns right on its own too.
                { key: "id", name: "#", width: 50, align: "right", dataType: "number" },

                { key: "first", name: "First name", width: 120 },
                { key: "last", name: "Last name", width: 140 },

                // A percentage width: resolved against the grid's own width.
                { key: "team", name: "Team", width: "20%" },

                { key: "score", name: "Score", width: 70, dataType: "number", align: "right" },

                // Dates: `displayFormat` decides what the cell shows. The row keeps the Date.
                { key: "joined", name: "Joined", width: 110, displayFormat: "date" },

                // A 10-character string becomes (555) 123-4567; anything else is left alone.
                { key: "phone", name: "Phone", width: 130, displayFormat: "phone" },

                // A computed column — no property behind it. `formatValue` is what makes it
                // sortable, searchable and copyable, since there is no value to read.
                {
                    key: "full",
                    name: "Full name",
                    width: 180,
                    readonly: true,
                    formatValue: (col, row) => `${row.last}, ${row.first}`,
                    render: (cell) => `${cell.row.last}, ${cell.row.first}`,
                },

                // Present in the column set, absent from the grid.
                { key: "secret", name: "Secret", hidden: true },
            ],
        });

        window.grid = grid;
    </script>
</body>
</html>
